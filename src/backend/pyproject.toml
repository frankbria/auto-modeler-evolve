[project]
name = "automodeler-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138.1",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.21",
    "anthropic>=0.37.0",
    "pandas>=2.2.0",
    "numpy>=2.5.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.12.0",
    "reportlab>=4.0.0",
    "xgboost>=3.3.0",
    "lightgbm>=4.0.0",
    "openpyxl>=3.1.0",
    "imbalanced-learn>=0.12.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-bdd>=7.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
# -rs: report skip reasons; --strict-markers: unknown @pytest.mark.* is an error.
# The skip gate in tests/conftest.py fails the run on any non-allowlisted skip,
# so this enforcement works under the existing bare ``uv run pytest`` (CI yaml
# is protected and stays untouched).
addopts = "-rs --strict-markers"
markers = [
    "anyio: anyio pytest plugin marker (registered for --strict-markers)",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest-bdd>=8.1.0",
    "pytest-cov>=7.0.0",
    # Splits the suite into balanced shards for the parallel backend-tests.yml
    # matrix (`pytest --splits N --group G`). Inactive on a bare `uv run pytest`,
    # so evolve.sh's local full-suite verification is unaffected.
    "pytest-split>=0.9.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
]
