name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # 'labeled'/'unlabeled' so (re)approving a fork PR via the 'ci-approved' label
    # re-evaluates the gate below; 'synchronize' so each new fork commit must be
    # re-approved — approval is bound to the reviewed commit, not the PR (issue #2).
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Least privilege: build verification never needs write access to the repo.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"

      # Fork PRs run untrusted code. Do NOT execute build/test until a maintainer
      # explicitly approves by adding the 'ci-approved' label (issue #2, AC #4).
      # This step FAILS the job so the gated PR is never reported as verified
      # (a skipped step would leave the required check green and mergeable). Adding
      # the label re-runs the workflow (see `types: [..., labeled]`) and lets the
      # verification step below run instead.
      - name: Require approval for fork PRs
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          (
            github.event.action == 'synchronize' ||
            !contains(github.event.pull_request.labels.*.name, 'ci-approved')
          )
        run: |
          echo "::error::Build verification is gated for fork PRs. A maintainer must review the current head commit and (re)add the 'ci-approved' label — approval is rechecked on every new commit. CI stays red until then."
          exit 1

      - name: Detect and verify project
        if: >-
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository ||
          (
            github.event.action != 'synchronize' &&
            contains(github.event.pull_request.labels.*.name, 'ci-approved')
          )
        run: |
          chmod +x scripts/detect_stack.sh

          # run_cmd: execute a trusted fixed command string as an argv array — no
          # eval, no shell — defense in depth against command injection (issue #2).
          run_cmd() {
            local cmdstr="$1"; shift
            [ -n "$cmdstr" ] || return 0
            local -a parts
            read -ra parts <<<"$cmdstr"
            [ "${#parts[@]}" -gt 0 ] || return 0
            "${parts[@]}" "$@"
          }

          # A non-zero exit means detection refused to proceed (e.g. an unsafe
          # substack directory name) — fail closed, do NOT coerce to "unknown"
          # (which would skip verification and report green) (issue #2).
          if ! STACK_JSON=$(bash scripts/detect_stack.sh src/); then
            echo "::error::Stack detection failed — refusing to verify (unsafe directory name?)."
            exit 1
          fi
          STACK=$(echo "$STACK_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['stack'])")
          echo "Detected stack: $STACK"

          if [ "$STACK" = "unknown" ]; then
            echo "No project stack detected yet — skipping build verification."
            exit 0
          fi

          if [ "$STACK" = "monorepo" ]; then
            echo "Monorepo detected — verifying each substack..."
            echo "$STACK_JSON" | python3 -c "
          import json, subprocess, sys, os, shlex

          data = json.load(sys.stdin)
          substacks = data.get('substacks', [])
          failed = False


          def run(args, cwd):
              return subprocess.run(args, cwd=cwd)


          for s in substacks:
              subdir = os.path.join('src', s['dir'])
              print(f\"\n=== {s['name']} ({s['stack']}) ===\")

              # Install dependencies (fixed argv, shell=False). A failed install
              # fails the substack so the check never goes green on broken deps.
              # Lockfile-enforcing installs (#21): a lock/manifest mismatch FAILS
              # the build instead of silently re-resolving to unpinned versions.
              install_ok = True
              if s['stack'] in ('typescript', 'javascript', 'nextjs'):
                  install_ok = run(['npm', 'ci'], subdir).returncode == 0
              elif s['stack'] == 'python':
                  if os.path.exists(os.path.join(subdir, 'uv.lock')):
                      install_ok = run(['uv', 'sync', '--locked'], subdir).returncode == 0
                  elif run(['pip', 'install', '-e', '.'], subdir).returncode != 0:
                      install_ok = run(['pip', 'install', '-r', 'requirements.txt'], subdir).returncode == 0

              if not install_ok:
                  print(f\"::error::Dependency installation failed for {s['name']}\")
                  failed = True
                  continue

              # Build/test/lint come from detect_stack.sh's fixed map; split into an
              # argv array and run shell=False so no string is ever shell-evaluated.
              for cmd_name in ('build', 'test', 'lint'):
                  cmd = s.get(cmd_name, '')
                  # The heavy Python suite (~6.7k tests) runs sharded in
                  # backend-tests.yml — keep this job a fast build+lint smoke.
                  # Frontend tests stay here (jest is quick). (CI sharding split.)
                  if cmd_name == 'test' and s['stack'] == 'python':
                      print(f\"Skipping {s['name']} tests here - sharded in backend-tests.yml\")
                      continue
                  if cmd:
                      print(f'Running {cmd_name}: {cmd}')
                      result = subprocess.run(shlex.split(cmd), cwd=subdir)
                      if result.returncode != 0 and cmd_name != 'lint':
                          failed = True

          sys.exit(1 if failed else 0)
          "
          else
            # Single-stack path
            BUILD_CMD=$(echo "$STACK_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['build'])")
            TEST_CMD=$(echo "$STACK_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['test'])")
            LINT_CMD=$(echo "$STACK_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['lint'])")

            cd src/

            # npm ci (no install fallback) enforces package-lock.json (#21).
            case "$STACK" in
              typescript|javascript|nextjs) npm ci ;;
              python) pip install -e . 2>/dev/null || pip install -r requirements.txt 2>/dev/null || true ;;
              rust) ;;
            esac

            [ -n "$BUILD_CMD" ] && echo "Running build: $BUILD_CMD" && run_cmd "$BUILD_CMD"
            [ -n "$TEST_CMD" ] && echo "Running tests: $TEST_CMD" && run_cmd "$TEST_CMD"
            [ -n "$LINT_CMD" ] && echo "Running lint: $LINT_CMD" && run_cmd "$LINT_CMD" || true
          fi
