name: Security Audit

# Dependency-vulnerability gate (#21). Kept separate from ci.yml so the weekly
# cron and the audit-only permissions don't entangle the gated build/test job.
# Fails on a known HIGH+ advisory against the committed lockfiles; the weekly
# run re-checks the same pins so a newly-disclosed CVE surfaces without a push.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC

# Reads lockfiles + queries advisory DBs; never needs write access.
permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Mirror ci.yml's fork-PR gate (issue #2): fail (don't skip) untrusted fork
      # PRs until a maintainer reviews the head commit and (re)adds 'ci-approved'.
      # The schedule/push events bypass this (event_name != pull_request).
      - name: Require approval for fork PRs
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          (
            github.event.action == 'synchronize' ||
            !contains(github.event.pull_request.labels.*.name, 'ci-approved')
          )
        run: |
          echo "::error::Dependency audit is gated for fork PRs. A maintainer must review the current head commit and (re)add the 'ci-approved' label."
          exit 1

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      # Audit the exact locked dependency set, then run pip-audit over the
      # resolved environment. Non-zero exit (a known advisory) fails the job.
      - name: Audit Python dependencies (pip-audit)
        working-directory: src/backend
        run: |
          uv sync --locked
          uv run --with pip-audit pip-audit

      # Blocking as of #48: the frontend HIGH advisories were cleared (next
      # bumped to 16.2.9 within v16, the unused `shadcn` scaffolding CLI removed
      # from runtime deps, and ws/flatted/picomatch/qs pinned via npm overrides).
      # A non-zero exit (any new HIGH+ advisory) now fails the job.
      - name: Audit Node dependencies (npm audit)
        working-directory: src/frontend
        run: npm audit --audit-level=high
