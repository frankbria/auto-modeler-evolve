name: E2E

# Runs the Playwright end-to-end suite (the only automated coverage of the
# upload → train → deploy → predict workflow). Kept separate from ci.yml so the
# fast build/unit gate stays quick; this job is heavier (boots both servers +
# a real browser). See issue #16.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Mirror ci.yml: 'labeled'/'unlabeled' so (re)approving a fork PR via the
    # 'ci-approved' label re-evaluates the gate below; 'synchronize' so each new
    # fork commit must be re-approved (issue #2).
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Least privilege: the E2E job never needs write access to the repo.
permissions:
  contents: read

# A new push supersedes in-flight runs for the same ref.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Fork PRs run untrusted code, and E2E executes the full app + a browser.
      # Fail (don't skip) until a maintainer reviews the current head commit and
      # (re)adds the 'ci-approved' label — a skipped step would leave a required
      # check green and mergeable (issue #2). This failure short-circuits every
      # step below (they keep the default `success()` guard). Adding the label
      # re-runs this workflow (see `types: [..., labeled]`).
      - name: Require approval for fork PRs
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          (
            github.event.action == 'synchronize' ||
            !contains(github.event.pull_request.labels.*.name, 'ci-approved')
          )
        run: |
          echo "::error::E2E is gated for fork PRs. A maintainer must review the current head commit and (re)add the 'ci-approved' label — approval is rechecked on every new commit. CI stays red until then."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the GITHUB_TOKEN in .git/config — nothing here pushes,
          # and the E2E step runs (approved) fork code. Defense in depth on top
          # of `permissions: contents: read`.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"

      - name: Install backend deps
        working-directory: src/backend
        run: uv sync

      - name: Install frontend deps
        working-directory: src/frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium

      # Playwright's webServer config boots uvicorn (:8000) and next dev (:3000)
      # itself; CI=true (set by Actions) makes it start fresh servers and forbid
      # .only. A non-zero exit here fails the job (issue #16 AC).
      - name: Run Playwright E2E
        working-directory: src/frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: src/frontend/playwright-report/
          retention-days: 7
